<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Simulate</title>
  <script>
    (function () {
      try {
        var choice = localStorage.getItem('simulate-appearance');
        var dark = choice === 'dark' || ((choice === 'system' || !choice) && matchMedia('(prefers-color-scheme: dark)').matches);
        if (choice === 'light') dark = false;
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#1c1c1e' : '#f5f5f7');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/index.tsx"></script>
</body>
</html>
